$lock_cmd = pidof hyprlock || ~/.config/hypr/scripts/lock.sh
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "enable"})'
    inhibit_sleep = 3
}

listener {
    timeout = 270
    on-timeout = ~/.config/hypr/scripts/idle-guard.sh screensaver
    on-resume = ~/.config/hypr/scripts/stop-screensaver.sh
}

listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/idle-guard.sh lock
}

listener {
    timeout = 600
    on-timeout = ~/.config/hypr/scripts/idle-guard.sh dpms-off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "enable"})'
}

listener {
    timeout = 900
    on-timeout = ~/.config/hypr/scripts/idle-guard.sh suspend
}
