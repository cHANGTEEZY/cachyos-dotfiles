$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    immediate_render = true
    text_trim = true
}

animations {
    enabled = false
}

background {
    monitor =
    path = /home/changteezy/Pictures/Wallpapers/wallhaven-exo2gr.jpg
    color = rgba(000000ff)
    blur_passes = 0
    brightness = 0.85
}

label {
    monitor =
    text = $TIME
    color = rgba(eeeeeecc)
    font_size = 22
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(000000aa)

    position = 0, -36
    halign = center
    valign = top
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(bbbbbbaa)
    font_size = 12
    font_family = $font

    position = 0, -68
    halign = center
    valign = top
    zindex = 2
}

input-field {
    monitor =
    size = 280, 44
    outline_thickness = 1
    inner_color = rgba(090909cc)
    outer_color = rgba(ffffff40)
    check_color = rgba(d8d8d8ff)
    fail_color = rgba(d66c6cff)
    font_color = rgba(f5f5f5ff)
    font_family = $font

    placeholder_text = Password
    fail_text = $PAMFAIL$FPRINTFAIL
    fade_on_empty = false
    rounding = 0
    dots_size = 0.18
    dots_spacing = 0.35
    dots_center = true

    position = 0, 80
    halign = center
    valign = bottom
    zindex = 3
}

label {
    monitor =
    text = Type your password to unlock
    color = rgba(aaaaaa99)
    font_size = 10
    font_family = $font

    position = 0, 36
    halign = center
    valign = bottom
    zindex = 2
}
